name: Sync AUR package

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [desktop-release]
  schedule:
    # Twice daily (06:15 and 18:15 UTC)
    - cron: '15 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-aur
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: Andrew-AI-JR/Desktop-Releases
      PKGNAME: junior-desktop
    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update PKGBUILD from latest release
        id: update
        run: |
          set -euo pipefail
          chmod +x scripts/update-from-release.sh

          workdir="$(mktemp -d)"
          cp PKGBUILD .SRCINFO "${workdir}/"

          docker run --rm \
            -v "${workdir}:/work" \
            -v "${GITHUB_WORKSPACE}/scripts/update-from-release.sh:/work/update-from-release.sh:ro" \
            -w /work \
            -e UPSTREAM_REPO \
            -e PKGNAME \
            archlinux/archlinux:latest \
            bash -lc 'pacman -Sy --noconfirm curl jq base-devel git >/dev/null && ./update-from-release.sh'

          cp "${workdir}/PKGBUILD" "${workdir}/.SRCINFO" .
          rm -rf "${workdir}"

          pkgver="$(grep -E '^pkgver=' PKGBUILD | sed 's/^pkgver=//')"
          echo "pkgver=${pkgver}" >> "$GITHUB_OUTPUT"

          if git diff --quiet PKGBUILD .SRCINFO; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to AUR
        id: publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          PKGNAME: junior-desktop
          COMMIT_MESSAGE: Update to ${{ steps.update.outputs.pkgver }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-to-aur.sh
          ./scripts/publish-to-aur.sh

      # Only bump the mirror version after a successful AUR publish.
      # If AUR is in maintenance, publish soft-succeeds and we leave PKGBUILD unchanged on main.
      - name: Commit and push mirror repository
        if: steps.update.outputs.changed == 'true' && steps.publish.outputs.maintenance != 'true'
        run: |
          set -euo pipefail
          pkgver="${{ steps.update.outputs.pkgver }}"
          git add PKGBUILD .SRCINFO
          git commit -m "chore(aur): update to ${pkgver}"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "push attempt ${attempt} failed, retrying..." >&2
            sleep 5
          done
          echo "failed to push after 3 attempts" >&2
          exit 1
